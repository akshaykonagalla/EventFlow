version: "3.9"

services:

  frontend:

    build:
      context: ./eventflow-client

    ports:
      - "3000:3000"

    depends_on:
      - backend

    environment:
      - CHOKIDAR_USEPOLLING=true

  backend:

    build:
      context: ./eventflow-server

    ports:
      - "5002:5002"

    env_file:
      - ./eventflow-server/.env

    depends_on:
      - redis

  redis:

    image: redis:7

    ports:
      - "6379:6379"